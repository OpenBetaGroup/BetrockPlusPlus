name: Build & Release Server

# Manual-only. Lets you type the release notes at trigger-time and builds
# the SERVER (BUILD_SERVER=ON) for all 8 targets, then publishes one
# GitHub Release with all the binaries attached.
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag for this release (e.g. v0.2.0)"
        required: true
      release_name:
        description: "Release title (leave blank to reuse the tag)"
        required: false
      draft:
        description: "Create as a draft (review before publishing)"
        required: false
        type: boolean
        default: true
      prerelease:
        description: "Mark as a pre-release"
        required: false
        type: boolean
        default: false

env:
  # Toolchain requirement from BUILDING.md (C++23 needs GCC 13+/Clang 17+).
  # Pulled from the ubuntu-toolchain-r PPA so we still link against the
  # older/wider-compatible glibc that ships with ubuntu-22.04 (2.35+).
  LINUX_GCC_VERSION: "13"
  LIBDEFLATE_VERSION: "1.23"
  BINARY_NAME: BetrockPlusPlus

permissions:
  contents: write

concurrency:
  group: build-release-server-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------
  # Sanity check: tag_name must match the project version in CMakeLists.txt
  # ---------------------------------------------------------------------
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag_name matches project version
        shell: bash
        run: |
          TAG="${{ inputs.tag_name }}"
          TAG_VERSION="${TAG#v}"  # strip a leading "v" (e.g. v0.1.3 -> 0.1.3)

          PROJECT_VERSION=$(grep -oP '(?<=project\(Betrock\+\+ VERSION )[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)

          if [ -z "$PROJECT_VERSION" ]; then
            echo "::error::Could not find the project version in CMakeLists.txt"
            exit 1
          fi

          echo "tag_name:        $TAG"
          echo "tag version:     $TAG_VERSION"
          echo "project version: $PROJECT_VERSION"

          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "::error::tag_name '${TAG}' implies version '${TAG_VERSION}', but CMakeLists.txt has version '${PROJECT_VERSION}'. Bump the project version or fix the tag before releasing."
            exit 1
          fi

  # ---------------------------------------------------------------------
  # Windows x86_64
  # ---------------------------------------------------------------------
  windows-x64:
    needs: check-version
    runs-on: windows-2022
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
    steps:
      - uses: actions/checkout@v4

      - name: Use runner-preinstalled vcpkg
        shell: pwsh
        run: |
          # GitHub's windows-2022 image ships vcpkg already; reuse it instead
          # of cloning fresh (faster + avoids network flakiness).
          Copy-Item -Recurse "$env:VCPKG_INSTALLATION_ROOT" "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat"

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\vcpkg\installed
          key: vcpkg-x64-windows-static-${{ hashFiles('vcpkg.json') }}

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_SERVER=ON `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          $out = "package"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item build\$env:BINARY_NAME.exe $out\
          Copy-Item README.md,LICENSE $out\
          Compress-Archive -Path $out\* -DestinationPath "$env:BINARY_NAME-Server-windows-x86_64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: ${{ env.BINARY_NAME }}-Server-windows-x86_64.zip

  # ---------------------------------------------------------------------
  # Windows arm64 (native GH-hosted arm64 Windows runner)
  # ---------------------------------------------------------------------
  windows-arm64:
    needs: check-version
    runs-on: windows-11-arm
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
    steps:
      - uses: actions/checkout@v4

      - name: Use runner-preinstalled vcpkg
        shell: pwsh
        run: |
          Copy-Item -Recurse "$env:VCPKG_INSTALLATION_ROOT" "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat"

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\vcpkg\installed
          key: vcpkg-arm64-windows-static-${{ hashFiles('vcpkg.json') }}

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_SERVER=ON `
            -DBETACRAFT_HEARTBEAT=ON `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=arm64-windows-static `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          $out = "package"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item build\$env:BINARY_NAME.exe $out\
          Copy-Item README.md,LICENSE $out\
          Compress-Archive -Path $out\* -DestinationPath "$env:BINARY_NAME-Server-windows-arm64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: ${{ env.BINARY_NAME }}-Server-windows-arm64.zip

  # ---------------------------------------------------------------------
  # Linux x86_64 (glibc) - native
  # ---------------------------------------------------------------------
  linux-glibc-x86_64:
    needs: check-version
    runs-on: ubuntu-22.04 # glibc 2.35, matches BUILDING.md's stated minimum
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain + dependencies
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git cmake ninja-build zip \
            gcc-${LINUX_GCC_VERSION} g++-${LINUX_GCC_VERSION} \
            libcurl4-openssl-dev

      - name: Build & install libdeflate (static, provides the CONFIG package CMakeLists.txt requires)
        run: |
          git clone --depth 1 --branch "v${LIBDEFLATE_VERSION}" https://github.com/ebiggers/libdeflate.git /tmp/libdeflate
          cmake -S /tmp/libdeflate -B /tmp/libdeflate/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DCMAKE_C_COMPILER=gcc-${LINUX_GCC_VERSION} \
            -DLIBDEFLATE_BUILD_STATIC_LIB=ON \
            -DLIBDEFLATE_BUILD_SHARED_LIB=OFF \
            -DLIBDEFLATE_BUILD_GZIP=OFF
          cmake --build /tmp/libdeflate/build -j"$(nproc)"
          sudo cmake --install /tmp/libdeflate/build

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SERVER=ON \
            -DBETACRAFT_HEARTBEAT=ON \
            -DCMAKE_PREFIX_PATH=/usr/local \
            -DCMAKE_C_COMPILER=gcc-${LINUX_GCC_VERSION} \
            -DCMAKE_CXX_COMPILER=g++-${LINUX_GCC_VERSION}

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Package
        run: |
          out=package
          mkdir -p "$out"
          cp build/$BINARY_NAME "$out"/
          cp README.md LICENSE "$out"/
          (cd "$out" && zip -r "../${BINARY_NAME}-Server-linux-glibc-x86_64.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: linux-glibc-x86_64
          path: ${{ env.BINARY_NAME }}-Server-linux-glibc-x86_64.zip

  # ---------------------------------------------------------------------
  # Linux aarch64 (glibc) - native GH-hosted arm64 Linux runner (no
  # cross-compilation needed)
  # ---------------------------------------------------------------------
  linux-glibc-aarch64:
    needs: check-version
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain + dependencies
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git cmake ninja-build zip \
            gcc-${LINUX_GCC_VERSION} g++-${LINUX_GCC_VERSION} \
            libcurl4-openssl-dev

      - name: Build & install libdeflate (static)
        run: |
          git clone --depth 1 --branch "v${LIBDEFLATE_VERSION}" https://github.com/ebiggers/libdeflate.git /tmp/libdeflate
          cmake -S /tmp/libdeflate -B /tmp/libdeflate/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DCMAKE_C_COMPILER=gcc-${LINUX_GCC_VERSION} \
            -DLIBDEFLATE_BUILD_STATIC_LIB=ON \
            -DLIBDEFLATE_BUILD_SHARED_LIB=OFF \
            -DLIBDEFLATE_BUILD_GZIP=OFF
          cmake --build /tmp/libdeflate/build -j"$(nproc)"
          sudo cmake --install /tmp/libdeflate/build

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SERVER=ON \
            -DBETACRAFT_HEARTBEAT=ON \
            -DCMAKE_PREFIX_PATH=/usr/local \
            -DCMAKE_C_COMPILER=gcc-${LINUX_GCC_VERSION} \
            -DCMAKE_CXX_COMPILER=g++-${LINUX_GCC_VERSION}

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Package
        run: |
          out=package
          mkdir -p "$out"
          cp build/$BINARY_NAME "$out"/
          cp README.md LICENSE "$out"/
          (cd "$out" && zip -r "../${BINARY_NAME}-Server-linux-glibc-aarch64.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: linux-glibc-aarch64
          path: ${{ env.BINARY_NAME }}-Server-linux-glibc-aarch64.zip

  # ---------------------------------------------------------------------
  # Linux x86_64 (musl / Alpine)
  # ---------------------------------------------------------------------
  linux-musl-x86_64:
    needs: check-version
    runs-on: ubuntu-latest
    container:
      image: alpine:3.22
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain + dependencies
        run: |
          apk add --no-cache build-base cmake ninja git zip curl-dev openssl-dev linux-headers

      - name: Build & install libdeflate (static)
        run: |
          git clone --depth 1 --branch "v${LIBDEFLATE_VERSION}" https://github.com/ebiggers/libdeflate.git /tmp/libdeflate
          cmake -S /tmp/libdeflate -B /tmp/libdeflate/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DLIBDEFLATE_BUILD_STATIC_LIB=ON \
            -DLIBDEFLATE_BUILD_SHARED_LIB=OFF \
            -DLIBDEFLATE_BUILD_GZIP=OFF
          cmake --build /tmp/libdeflate/build --parallel
          cmake --install /tmp/libdeflate/build

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SERVER=ON \
            -DBETACRAFT_HEARTBEAT=ON \
            -DCMAKE_PREFIX_PATH=/usr/local

      - name: Build
        run: cmake --build build --parallel

      - name: Package
        run: |
          out=package
          mkdir -p "$out"
          cp build/$BINARY_NAME "$out"/
          cp README.md LICENSE "$out"/
          (cd "$out" && zip -r "../${BINARY_NAME}-Server-linux-musl-x86_64.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: linux-musl-x86_64
          path: ${{ env.BINARY_NAME }}-Server-linux-musl-x86_64.zip

  # ---------------------------------------------------------------------
  # Linux aarch64 (musl / Alpine)
  #
  # GitHub doesn't support JavaScript actions (checkout, upload-artifact)
  # inside Alpine containers on arm64 runners, so instead of `container:` we
  # check out on the host and run the build inside `docker run alpine`.
  # ---------------------------------------------------------------------
  linux-musl-aarch64:
    needs: check-version
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Build inside Alpine container
        run: |
          docker run --rm \
            -e LIBDEFLATE_VERSION -e BINARY_NAME \
            -v "$PWD:/work" -w /work \
            alpine:3.22 sh -euxc '
              apk add --no-cache build-base cmake ninja git zip curl-dev openssl-dev linux-headers

              git clone --depth 1 --branch "v${LIBDEFLATE_VERSION}" https://github.com/ebiggers/libdeflate.git /tmp/libdeflate
              cmake -S /tmp/libdeflate -B /tmp/libdeflate/build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=/usr/local \
                -DLIBDEFLATE_BUILD_STATIC_LIB=ON \
                -DLIBDEFLATE_BUILD_SHARED_LIB=OFF \
                -DLIBDEFLATE_BUILD_GZIP=OFF
              cmake --build /tmp/libdeflate/build --parallel
              cmake --install /tmp/libdeflate/build

              cmake -S . -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_SERVER=ON \
                -DBETACRAFT_HEARTBEAT=ON \
                -DCMAKE_PREFIX_PATH=/usr/local
              cmake --build build --parallel

              out=package
              mkdir -p "$out"
              cp "build/$BINARY_NAME" "$out"/
              cp README.md LICENSE "$out"/
              (cd "$out" && zip -r "../${BINARY_NAME}-Server-linux-musl-aarch64.zip" .)
            '

      - uses: actions/upload-artifact@v4
        with:
          name: linux-musl-aarch64
          path: ${{ env.BINARY_NAME }}-Server-linux-musl-aarch64.zip

  # ---------------------------------------------------------------------
  # macOS arm64 (Apple Silicon / M-series) - native GH-hosted arm64 runner
  # ---------------------------------------------------------------------
  macos-arm64:
    needs: check-version
    runs-on: macos-15 # native Apple Silicon (M-series) runner
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain + dependencies
        run: |
          brew update
          brew install ninja llvm libdeflate curl

      - name: Build & install libdeflate (static)
        run: |
          LLVM_PREFIX="$(brew --prefix llvm)"
          git clone --depth 1 --branch "v${LIBDEFLATE_VERSION}" https://github.com/ebiggers/libdeflate.git /tmp/libdeflate
          cmake -S /tmp/libdeflate -B /tmp/libdeflate/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DCMAKE_C_COMPILER="$LLVM_PREFIX/bin/clang" \
            -DLIBDEFLATE_BUILD_STATIC_LIB=ON \
            -DLIBDEFLATE_BUILD_SHARED_LIB=OFF \
            -DLIBDEFLATE_BUILD_GZIP=OFF
          cmake --build /tmp/libdeflate/build -j"$(sysctl -n hw.ncpu)"
          sudo cmake --install /tmp/libdeflate/build

      - name: Configure
        run: |
          LLVM_PREFIX="$(brew --prefix llvm)"
          CURL_PREFIX="$(brew --prefix curl)"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SERVER=ON \
            -DBETACRAFT_HEARTBEAT=ON \
            -DCMAKE_PREFIX_PATH="/usr/local;${CURL_PREFIX}" \
            -DCMAKE_C_COMPILER="$LLVM_PREFIX/bin/clang" \
            -DCMAKE_CXX_COMPILER="$LLVM_PREFIX/bin/clang++"

      - name: Build
        run: cmake --build build -j"$(sysctl -n hw.ncpu)"

      - name: Package
        run: |
          out=package
          mkdir -p "$out"
          cp build/$BINARY_NAME "$out"/
          cp README.md LICENSE "$out"/
          (cd "$out" && zip -r "../${BINARY_NAME}-Server-macos-arm64.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: ${{ env.BINARY_NAME }}-Server-macos-arm64.zip

  # ---------------------------------------------------------------------
  # Publish everything as one GitHub Release
  # ---------------------------------------------------------------------
  release:
    needs:
      - check-version
      - windows-x64
      - windows-arm64
      - linux-glibc-x86_64
      - linux-glibc-aarch64
      - linux-musl-x86_64
      - linux-musl-aarch64
      - macos-arm64
    runs-on: ubuntu-latest
    steps:
      # Check out the exact commit this workflow was dispatched on (the same
      # one every build job built). The tag may not exist yet, so don't try
      # to check it out by name.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Generate full changelog link
        id: changelog
        shell: bash
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          # If the tag already exists, compare against the tag before it;
          # otherwise the newest existing tag reachable from HEAD is the
          # previous release.
          if git rev-parse -q --verify "refs/tags/${TAG_NAME}" >/dev/null; then
            PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${TAG_NAME}^" 2>/dev/null || true)
          else
            PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)
          fi
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "::error::Could not determine the previous tag for ${TAG_NAME}."
            exit 1
          fi
          echo "body=**Full Changelog**: https://github.com/OpenBetaGroup/BetrockPlusPlus/compare/${PREVIOUS_TAG}...${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          # Creates the tag at the built commit if it doesn't exist yet.
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.release_name || inputs.tag_name }}
          body: ${{ steps.changelog.outputs.body }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          files: artifacts/**/*.zip
